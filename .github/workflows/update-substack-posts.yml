name: Update Substack posts

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Update Paperesque posts
        run: ruby script/update-substack-posts

      - name: Commit changes
        run: |
          if git diff --quiet -- writing.md; then
            echo "No Substack post updates."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writing.md
          git commit -m "Update Substack posts"
          git push
